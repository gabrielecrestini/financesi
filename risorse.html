<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        /* == STILI ESISTENTI DALLA HOME PAGE == */
        :root {
            --primary-color: #0a2e5c;
            --secondary-color: #D4AF37;
            --cta-color: #1ce783;
            --dark-color: #1a1a1a;
            --light-color: #ffffff;
            --background-color: #f9faff;
            --text-color: #333;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Lato', sans-serif;
            --card-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
            --transition-speed: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            --hero-image-url: url('https://image.pollinations.ai/prompt/futuristic%20financial%20digital%20interface%20background%20blue%20and%20gold%20data%20network%20secure%20elegant%20high%20resolution%204k');
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--background-color);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .section {
            padding: 5.5rem 0; 
            position: relative;
        }
        
        .section-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 3.5rem; 
            font-weight: 700;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -15px;
            transform: translateX(-50%);
            width: 80px;
            height: 5px;
            background: var(--secondary-color);
            border-radius: 3px;
        }
        
        .section-risorse { background-color: var(--light-color); }
        .section-timeline { background-color: var(--background-color); } /* NUOVA SEZIONE */
        .section-concetti { background-color: var(--light-color); } 


        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 380px));
            gap: 2.5rem;
            justify-content: center;
        }

        .conto-card {
            background-color: var(--light-color);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            border: 1px solid #eef;
            position: relative;
        }

        .conto-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }
        
        .conto-card-badge {
            position: absolute;
            top: 20px;
            left: -1px;
            background-color: var(--secondary-color);
            color: var(--dark-color);
            padding: 5px 20px;
            font-weight: 700;
            font-family: var(--font-heading);
            font-size: 0.9rem;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3);
        }

        .conto-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .conto-content {
            padding: 2.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .conto-content h3 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .conto-content p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            flex-grow: 1; 
        }

        .conto-cta {
            display: block;
            width: 100%;
            padding: 1.1rem 1.5rem;
            background: var(--primary-color);
            color: var(--light-color);
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(10, 46, 92, 0.2);
        }

        .conto-cta:hover {
            background-color: var(--dark-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        footer {
            background-color: var(--primary-color);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            padding: 4rem 2rem 2rem 2rem; 
            margin-top: 5rem;
            position: relative;
        }
        
        .lang-selector {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .lang-selector button {
            background: none;
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            padding: 8px 15px;
            font-weight: 700;
            font-family: var(--font-heading);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lang-selector button:hover {
            background-color: var(--secondary-color);
            color: var(--dark-color);
        }
        
        .lang-selector button.active {
            background-color: var(--secondary-color);
            color: var(--dark-color);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        footer p {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        footer p:first-of-type { 
            font-weight: 700;
            color: var(--light-color);
            font-size: 1.1rem;
        }
        
        .footer-links {
            margin: 1rem 0;
        }
        .footer-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover {
            color: var(--light-color);
            text-decoration: underline;
        }

        .animate-on-scroll {
            opacity: 0;
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        
        .fade-in-up {
            transform: translateY(50px);
        }

        .is-visible {
            opacity: 1;
            transform: translate(0, 0) scale(1);
        }

        /* == NUOVI STILI PER QUESTA PAGINA == */

        .hero-simple {
            position: relative;
            padding: 6rem 2rem 5rem 2rem;
            text-align: center;
            color: var(--light-color);
            background-image: var(--hero-image-url);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .hero-simple::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(10, 46, 92, 0.85), rgba(0, 0, 0, 0.7));
            z-index: 1;
        }
        
        .hero-simple-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-simple-content h1 {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 800;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .hero-simple-content p {
            font-size: 1.5rem;
            font-weight: 300;
            max-width: 700px;
            margin: 1rem auto 0 auto;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: rgba(255, 255, 255, 0.9);
        }
        
        /* === STILI PER SEZIONE CONCETTI === */
        .concetti-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            justify-content: center;
        }
        
        .concetto-item {
            text-align: center;
            padding: 2.5rem 2rem;
            background: var(--background-color); /* Sfondo leggermente diverso */
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #eef;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .concetto-item:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-shadow);
        }
        
        .concetto-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem auto;
            object-fit: contain;
            border-radius: 50%;
            background: var(--light-color);
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .concetto-item h3 {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .concetto-item p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-color);
        }
        
        /* === STILI PER NUOVA TIMELINE === */
        .timeline-container {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }

        .timeline-container::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--primary-color);
            opacity: 0.15;
            top: 20px;
            bottom: 20px;
            left: 50%;
            margin-left: -2px;
        }
        
        .timeline-item {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            margin-bottom: 2.5rem;
        }
        
        .timeline-item::after { /* I cerchi sulla linea */
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            right: -16px;
            background-color: var(--light-color);
            border: 5px solid var(--primary-color);
            top: 15px;
            border-radius: 50%;
            z-index: 1;
        }
        
        .timeline-item.left {
            left: 0;
            padding-right: 50px;
            text-align: right;
        }

        .timeline-item.right {
            left: 50%;
            padding-left: 50px;
            text-align: left;
        }
        
        .timeline-item.left::after {
            right: -16px; /* Posiziona il cerchio */
        }
        
        .timeline-item.right::after {
            left: -16px; /* Posiziona il cerchio */
        }
        
        .timeline-content {
            padding: 2rem;
            background: var(--light-color);
            position: relative;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid #eef;
        }
        
        .timeline-content h3 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .timeline-content p {
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .timeline-content .step {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
            font-family: var(--font-heading);
        }

        /* ============================== */

        .cta-box {
            background: var(--primary-color);
            color: var(--light-color);
            padding: 3rem;
            border-radius: 16px;
            text-align: center;
            max-width: 900px;
            margin: 4rem auto 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .cta-box h3 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .cta-box p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-box-link {
            display: inline-block;
            background: var(--cta-color);
            color: var(--dark-color);
            padding: 1.1rem 3rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(28, 231, 131, 0.3);
            text-transform: uppercase;
        }

        .cta-box-link:hover {
            background: var(--light-color);
            color: var(--primary-color);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 35px rgba(255, 255, 255, 0.3);
        }

        /* Correzioni responsive per i nuovi elementi */
        @media (max-width: 768px) {
            .section { padding: 4rem 0; }
            .section-title { font-size: 2.5rem; }
            .card-grid { grid-template-columns: 1fr; }
            .conto-content { padding: 2rem; }
            .conto-content h3 { font-size: 1.8rem; }
            
            .hero-simple-content h1 { font-size: 2.8rem; }
            .hero-simple-content p { font-size: 1.3rem; }
            
            .cta-box { padding: 2.5rem 1.5rem; }
            .cta-box h3 { font-size: 2rem; }
            
            /* Responsive Timeline */
            .timeline-container::after {
                left: 14px; /* Sposta la linea a sinistra */
            }
            .timeline-item {
                width: 100%;
                padding-left: 50px;
                padding-right: 10px;
                text-align: left;
            }
            .timeline-item.left, .timeline-item.right {
                left: 0;
                padding-left: 50px;
                padding-right: 10px;
                text-align: left;
            }
            .timeline-item.left::after, .timeline-item.right::after {
                left: 0; /* Sposta i cerchi sulla linea */
            }
        }

        @media (max-width: 480px) {
            .section-title { font-size: 2rem; }
            .hero-simple-content h1 { font-size: 2.4rem; }
            .hero-simple-content p { font-size: 1.1rem; }
            .concetto-item h3 { font-size: 1.4rem; }
            .timeline-content h3 { font-size: 1.5rem; }
        }

    </style>
</head>

        let currentLang = 'it';
        const langButtons = document.querySelectorAll('.lang-selector button');
        const risorseGrid = document.getElementById('risorse-grid');
        
        function populateRisorse(lang) {
            if (!risorseGrid) return; 
            
            risorseGrid.innerHTML = '';
            const tr = translations[lang]; 
            
            risorseData.forEach((risorsa, index) => {
                const card = document.createElement('div');
                card.className = 'conto-card animate-on-scroll fade-in-up';
                card.style.transitionDelay = `${index * 150}ms`;
                card.id = risorsa.id;
                
                card.innerHTML = `
                    <div class="conto-card-badge">${tr[risorsa.typeKey]}</div>
                    <img src="${risorsa.imageUrl}" alt="${tr[risorsa.titleKey]}" class="conto-image">
                    <div class="conto-content">

                        <p>${tr[risorsa.descriptionKey]}</p>
                        
                        <a href="${risorsa.linkUrl}" target="_blank" rel="sponsored nofollow noopener noreferrer" class="conto-cta">
                            ${tr[risorsa.ctaKey]}
                        </a>
                    </div>
                `;
                risorseGrid.appendChild(card);
            });
        }

        function changeLanguage(lang) {
            if (!translations[lang]) lang = 'it';
            currentLang = lang;
            localStorage.setItem('preferredLang', lang); 
            
            const tr = translations[lang];
            
            document.documentElement.lang = lang;
            document.title = tr.pageTitle;
            
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.dataset.langKey;
                if (tr[key]) {
                    el.innerHTML = tr[key];
                }
            });
            
            // Popola le risorse
            populateRisorse(lang);
            
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            
            setupScrollAnimations();
        }

        document.addEventListener('DOMContentLoaded', () => {
            langButtons.forEach(button => {
                button.addEventListener('click', () => {
                    changeLanguage(button.dataset.lang);
                });
            });

            let preferredLang = localStorage.getItem('preferredLang');
            if (preferredLang && translations[preferredLang]) {
                changeLanguage(preferredLang);
            } else {
                let browserLang = navigator.language.split('-')[0];
                changeLanguage(translations[browserLang] ? browserLang : 'it');
            }
        });

        function setupScrollAnimations() {
            const animatedElements = document.querySelectorAll('.animate-on-scroll');

            if ("IntersectionObserver" in window) {
                const observer = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, {
                    threshold: 0.1
                });

                animatedElements.forEach(el => {
                    el.classList.remove('is-visible'); 
                    observer.observe(el);
                });
            } else {
                animatedElements.forEach(el => {
                    el.classList.add('is-visible');
                });
            }
        }
        
        if(!localStorage.getItem('cookie_ack')){
            const b=document.createElement('div');
            b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#0a2e5c;color:#fff;padding:12px 16px;font-size:14px;z-index:9999;';

            document.body.appendChild(b);
            document.getElementById('okc').onclick=()=>{ localStorage.setItem('cookie_ack','1'); b.remove(); };
        }
