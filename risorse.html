<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cryptostarstudio - Impara e Simula</title>

    
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        /* == STILI ESISTENTI == */
        :root {
            --primary-color: #0a2e5c;
            --secondary-color: #D4AF37;
            --cta-color: #1ce783;
            --dark-color: #1a1a1a;
            --light-color: #ffffff;
            --background-color: #f9faff;
            --text-color: #333;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Lato', sans-serif;
            --card-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
            --transition-speed: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            --hero-image-url: url('https://image.pollinations.ai/prompt/futuristic%20financial%20digital%20interface%20background%20blue%20and%20gold%20data%20network%20secure%20elegant%20high%20resolution%204k');
            --success-color: #28a745;
            --danger-color: #dc3545;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--background-color);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .section {
            padding: 5.5rem 0; 
            position: relative;
        }
        
        .section-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 3.5rem; 
            font-weight: 700;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -15px;
            transform: translateX(-50%);
            width: 80px;
            height: 5px;
            background: var(--secondary-color);
            border-radius: 3px;
        }
        
        .section-risorse { background-color: var(--light-color); }
        .section-simulatore { background-color: var(--primary-color); } 
        .section-faq { background-color: var(--background-color); } 
        .section-concetti { background-color: var(--light-color); } 
        .section-guida-grafici { background-color: var(--background-color); } 
        .section-osservazione { background-color: var(--light-color); } 


        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 380px));
            gap: 2.5rem;
            justify-content: center;
        }

        .conto-card {
            background-color: var(--light-color);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            border: 1px solid #eef;
            position: relative;
        }

        .conto-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }
        
        .conto-card-badge {
            position: absolute;
            top: 20px;
            left: -1px;
            background-color: var(--secondary-color);
            color: var(--dark-color);
            padding: 5px 20px;
            font-weight: 700;
            font-family: var(--font-heading);
            font-size: 0.9rem;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3);
        }

        .conto-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .conto-content {
            padding: 2.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .conto-content h3 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .conto-content p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            flex-grow: 1; 
        }

        .conto-cta {
            display: block;
            width: 100%;
            padding: 1.1rem 1.5rem;
            background: var(--primary-color);
            color: var(--light-color);
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(10, 46, 92, 0.2);
        }

        .conto-cta:hover {
            background-color: var(--dark-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .link-inline {
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: underline;
        }
        .link-inline:hover {
            color: var(--secondary-color);
        }

        footer {
            background-color: var(--primary-color);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            padding: 4rem 2rem 2rem 2rem; 
            margin-top: 5rem;
            position: relative;
        }
        
        .lang-selector {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .lang-selector button {
            background: none;
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            padding: 8px 15px;
            font-weight: 700;
            font-family: var(--font-heading);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lang-selector button:hover {
            background-color: var(--secondary-color);
            color: var(--dark-color);
        }
        
        .lang-selector button.active {
            background-color: var(--secondary-color);
            color: var(--dark-color);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        footer p {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        footer p:first-of-type { 
            font-weight: 700;
            color: var(--light-color);
            font-size: 1.1rem;
        }
        
        .footer-links {
            margin: 1rem 0;
        }
        .footer-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover {
            color: var(--light-color);
            text-decoration: underline;
        }

        .animate-on-scroll {
            opacity: 0;
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        
        .fade-in-up {
            transform: translateY(50px);
        }

        .is-visible {
            opacity: 1;
            transform: translate(0, 0) scale(1);
        }

        /* == NUOVI STILI PER QUESTA PAGINA == */

        .hero-simple {
            position: relative;
            padding: 6rem 2rem 5rem 2rem;
            text-align: center;
            color: var(--light-color);
            background-image: var(--hero-image-url);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .hero-simple::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(10, 46, 92, 0.85), rgba(0, 0, 0, 0.7));
            z-index: 1;
        }
        
        .hero-simple-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-simple-content h1 {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 800;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .hero-simple-content p {
            font-size: 1.5rem;
            font-weight: 300;
            max-width: 700px;
            margin: 1rem auto 0 auto;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: rgba(255, 255, 255, 0.9);
        }
        
        /* === STILI PER NAVIGAZIONE A SCHEDE (TABS) === */
        .tabs-navigation {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 3rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            background: var(--light-color);
            padding: 0.5rem;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #eef;
        }
        .tab-button {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            background: transparent;
            border-radius: 50px;
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-button:hover {
            background: var(--background-color);
        }
        .tab-button.active {
            background: var(--primary-color);
            color: var(--light-color);
            box-shadow: 0 5px 15px rgba(10, 46, 92, 0.3);
        }
        
        .tab-panel {
            display: none; /* Nascosto di default */
            animation: fadeIn 0.8s ease;
        }
        .tab-panel.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Link di Salto Rapido */
        .skip-link {
            text-align: center;
            margin-bottom: 3rem;
        }
        .skip-link a {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: underline;
            cursor: pointer;
        }
        .skip-link a:hover {
            color: var(--secondary-color);
        }
        
        /* Pulsante di avanzamento tappa */
        .tappa-avanzamento {
            text-align: center;
            margin-top: 3.5rem;
        }
        .btn-avanti-tappa {
            background: var(--primary-color);
            color: var(--light-color);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-avanti-tappa:hover {
            background: var(--dark-color);
            transform: scale(1.05);
        }
        
        /* === STILI PER SEZIONE CONCETTI === */
        .concetti-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            justify-content: center;
        }
        
        .concetto-item {
            display: flex; 
            align-items: flex-start; 
            gap: 1.5rem;
            text-align: left;
            padding: 2rem;
            background: var(--light-color); 
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #eef;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .concetto-item:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-shadow);
        }
        
        .concetto-icon {
            width: 60px; 
            height: 60px;
            flex-shrink: 0; 
            object-fit: contain;
            border-radius: 50%;
            background: var(--background-color);
            padding: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .concetto-content h3 {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem; 
            font-weight: 700;
        }
        
        .concetto-content p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-color);
        }
        
        /* === STILI PER FAQ INTERATTIVA === */
        
        .faq-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .faq-item {
            background: var(--light-color);
            margin-bottom: 1rem;
            border-radius: 12px;
            border: 1px solid #eef;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            overflow: hidden; 
        }
        
        .faq-question {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.75rem 2rem;
            background: var(--light-color);
            border: none;
            cursor: pointer;
            text-align: left;
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            transition: background-color 0.3s ease;
        }
        
        .faq-question:hover {
            background-color: #fcfdff;
        }
        
        .faq-question::after { 
            content: '+';
            font-family: 'Lato', sans-serif;
            font-size: 2rem;
            font-weight: 300;
            color: var(--primary-color);
            transition: transform 0.3s ease;
            margin-left: 1rem;
        }
        
        .faq-item.active .faq-question::after { 
            content: '\00D7';
            transform: scale(1.2);
        }
        
        .faq-answer {
            max-height: 0; 
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }
        
        .faq-answer p {
            padding: 0 2rem 1.75rem 2rem;
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-color);
        }
        
        .faq-answer p a {
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: underline;
        }
        .faq-answer p a:hover {
            color: var(--secondary-color);
        }
        
        /* === STILI PER GUIDA GRAFICI INTERATTIVA (HOTSPOTS) === */
        .grafico-interattivo-container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }
        
        .grafico-interattivo-img {
            width: 100%;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }
        
        .hotspot {
            position: absolute;
            width: 30px;
            height: 30px;
            background: var(--primary-color);
            color: var(--light-color);
            border-radius: 50%;
            border: 3px solid var(--light-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 26px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse-hotspot 2s infinite;
        }
        .hotspot:hover {
            transform: scale(1.2);
            background: var(--cta-color);
            color: var(--dark-color);
            animation-play-state: paused;
        }
        
        @keyframes pulse-hotspot {
            0% { box-shadow: 0 5px 15px rgba(0,0,0,0.3), 0 0 0 0 rgba(10, 46, 92, 0.5); }
            70% { box-shadow: 0 5px 15px rgba(0,0,0,0.3), 0 0 0 15px rgba(10, 46, 92, 0); }
            100% { box-shadow: 0 5px 15px rgba(0,0,0,0.3), 0 0 0 0 rgba(10, 46, 92, 0); }
        }
        
        /* Posizionamento Hotspot (relativo a 900px di larghezza) */
        #hotspot-candela { top: 38%; left: 42%; }
        #hotspot-supporto { top: 70%; left: 30%; }
        #hotspot-resistenza { top: 15%; left: 55%; }
        #hotspot-volume { top: 85%; left: 65%; }

        /* === STILI PER SEZIONE OSSERVAZIONE === */
        .osservazione-container {
            display: grid;
            grid-template-columns: 2fr 1fr; /* 2/3 per grafico, 1/3 per guida */
            gap: 2.5rem;
        }
        
        .osservazione-grafico-box {
             background: var(--light-color);
             border-radius: 16px;
             padding: 2rem;
             box-shadow: var(--card-shadow);
             height: 600px;
             border: 1px solid #eef;
        }
        .osservazione-guida-box {
            background: var(--light-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--card-shadow);
            border: 1px solid #eef;
        }
        
        .osservazione-sub-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eef;
        }
        
        .guida-passo {
            margin-bottom: 1.5rem;
        }
        .guida-passo h4 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .guida-passo p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-color);
        }
        
        .tradingview-widget-container {
            height: calc(100% - 60px); /* Altezza meno titolo */
            width: 100%;
        }
        
        /* === STILI PER SIMULATORE === */
        .simulatore-container {
            display: grid;
            grid-template-columns: 2fr 1fr; /* 2/3 per mercato, 1/3 per portafoglio */
            gap: 2.5rem;
            max-width: 1200px; /* Ristretto per allineamento migliore */
            margin: 0 auto;
        }

        #mercato-container {
            background: var(--light-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            margin-top: 0; 
        }
        
        #portafoglio-container {
            background: var(--light-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            position: sticky; 
            top: 20px;
        }
        
        .simulatore-sub-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eef;
        }
        
        .portafoglio-valori { margin-bottom: 2rem; }
        .portafoglio-valori p {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .portafoglio-valori strong {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: 800;
            display: block;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }
        #portfolio-valore-totale {
             color: var(--cta-color);
             margin-bottom: 1rem;
        }
        #portfolio-liquidi {
            font-size: 1.8rem;
            color: var(--text-color);
        }
        
        #portfolio-assets .asset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #eef;
            font-size: 1rem;
        }
        #portfolio-assets .asset-item:last-child { border-bottom: none; }
        .asset-nome { font-weight: 700; }
        .asset-valore { text-align: right; }
        .asset-valore span { display: block; font-size: 0.9rem; color: #777; }
        
        .mercato-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #eef;
        }
        .mercato-item:last-child { border-bottom: none; }
        
        .mercato-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .mercato-icon { width: 32px; height: 32px; }
        .mercato-nome {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
        }
        .mercato-nome span {
            font-size: 0.8rem;
            color: #777;
            font-weight: 600;
            text-transform: uppercase;
            display: block;
        }
        
        .mercato-prezzo {
            text-align: right;
            font-size: 1rem;
            font-weight: 700;
        }
        .mercato-prezzo span {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .prezzo-positivo { color: var(--success-color); }
        .prezzo-negativo { color: var(--danger-color); }
        
        .mercato-bottoni { display: flex; gap: 0.5rem; margin-left: 0.5rem; }
        .btn-sim {
            border: none;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-compra { background: var(--success-color); color: white; }
        .btn-compra:hover { background: #218838; }
        .btn-vendi { background: var(--danger-color); color: white; }
        .btn-vendi:hover { background: #c82333; }
        
        #reset-sim-btn {
            background: none;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            display: inline-block;
        }
        #reset-sim-btn:hover { background: var(--primary-color); color: var(--light-color); }

        /* Modal Stili */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; 
            padding: 2.5rem;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: slideIn 0.4s ease-out;
        }
        .modal-content h3 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }
        .modal-content p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }
        .modal-input {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-family: var(--font-body);
        }
        .modal-bottoni {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        #modal-conferma, #modal-annulla, #modal-hotspot-chiudi {

            },
            {

        ];
        
        let currentLang = 'it';
        const langButtons = document.querySelectorAll('.lang-selector button');
        const risorseGrid = document.getElementById('risorse-grid');
        
        function populateRisorse(lang) {
            if (!risorseGrid) return; 
            
            risorseGrid.innerHTML = '';
            const tr = translations[lang]; 
            
            risorseData.sort((a, b) => {
                if (a.id === 'risorsa-binance') return -1;
                if (b.id === 'risorsa-binance') return 1;
                if (a.id === 'risorsa-coinmarketcap') return -1;
                if (b.id === 'risorsa-coinmarketcap') return 1;
                return 0;
            });
            
            risorseData.forEach((risorsa, index) => {
                const card = document.createElement('div');
                card.className = 'conto-card animate-on-scroll fade-in-up';
                card.style.transitionDelay = `${index * 100}ms`; 
                card.id = risorsa.id;
                
                card.innerHTML = `
                    <div class="conto-card-badge">${tr[risorsa.typeKey]}</div>
                    <img src="${risorsa.imageUrl}" alt="${tr[risorsa.titleKey]}" class="conto-image">
                    <div class="conto-content">
                        <h3>${tr[risorsa.titleKey]}</h3>
                        <p>${tr[risorsa.descriptionKey]}</p>
                        
                        <a href="${risorsa.linkUrl}" target="_blank" rel="sponsored nofollow noopener noreferrer" class="conto-cta">
                            ${tr[risorsa.ctaKey]}
                        </a>
                    </div>
                `;
                risorseGrid.appendChild(card);
            });
        }

        // --- LOGICA PER FAQ INTERATTIVA ---
        function setupFAQ() {
            const faqItems = document.querySelectorAll('.faq-item');

            faqItems.forEach(item => {
                const questionButton = item.querySelector('.faq-question');
                const answerPanel = item.querySelector('.faq-answer');

                questionButton.addEventListener('click', () => {
                    const isActive = item.classList.contains('active');
                    
                    faqItems.forEach(otherItem => {
                        otherItem.classList.remove('active');
                        otherItem.querySelector('.faq-answer').style.maxHeight = null;
                    });
                    
                    if (!isActive) {
                        item.classList.add('active');
                        answerPanel.style.maxHeight = answerPanel.scrollHeight + "px";
                    }
                });
            });
        }
        
        // --- LOGICA SIMULATORE ---
        const COIN_IDS = 'bitcoin,ethereum,dash,solana,binancecoin,ripple';
        const API_URL = `https://api.coingecko.com/api/v3/simple/price?ids=${COIN_IDS}&vs_currencies=eur&include_24hr_change=true`;
        
        let portafoglio = { liquidi: 10000, crypto: {} };
        let prezziAttuali = {}; 
        
        const mercatoList = document.getElementById('mercato-list');
        const portfolioValoreTotaleEl = document.getElementById('portfolio-valore-totale');
        const portfolioLiquidiEl = document.getElementById('portfolio-liquidi');
        const portfolioAssetsEl = document.getElementById('portfolio-assets');
        const resetBtn = document.getElementById('reset-sim-btn');
        
        const modal = document.getElementById('sim-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalInfo = document.getElementById('modal-info');
        const modalLiquidi = document.getElementById('modal-liquidi');
        const modalInput = document.getElementById('modal-input');
        const modalError = document.getElementById('modal-error');
        const modalConfermaBtn = document.getElementById('modal-conferma');
        const modalAnnullaBtn = document.getElementById('modal-annulla');
        const modalHotspotChiudiBtn = document.getElementById('modal-hotspot-chiudi');
        const modalSimContent = document.querySelector('.modal-sim-content');
        const modalHotspotContent = document.querySelector('.modal-hotspot-content');
        
        let modalData = {};

        function formatCurrency(num) {
            return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(num);
        }
        function formatPercent(num) {
            if (typeof num !== 'number') return '0.00%';
            return num.toFixed(2) + '%';
        }
        function formatCrypto(num) {
            return num.toFixed(8); 
        }
        
        function loadPortafoglio() {
            try {
                const salvato = localStorage.getItem('cryptoSimPortafoglio');
                if (salvato) {
                    portafoglio = JSON.parse(salvato);
                }
            } catch(e) { portafoglio = { liquidi: 10000, crypto: {} }; }
            renderPortafoglio();
        }
        
        function savePortafoglio() {
            try {
                localStorage.setItem('cryptoSimPortafoglio', JSON.stringify(portafoglio));
            } catch(e) { console.error("Errore salvataggio portafoglio", e); }
            renderPortafoglio();
        }
        
        function resetPortafoglio() {
            const tr = translations[currentLang];
            if (confirm(tr.simResetConfirm)) {
                portafoglio = { liquidi: 10000, crypto: {} };
                prezziAttuali = {}; 
                savePortafoglio();
                fetchPrezzi(); 
            }
        }
        
        async function fetchPrezzi() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                if (Object.keys(data).length === 0) throw new Error("API data empty");
                prezziAttuali = data;
                renderMercato();
                renderPortafoglio();
            } catch (error) {
                console.error("Errore API Coingecko:", error);
                const tr = translations[currentLang] || translations['it']; 
                if (mercatoList) {
                    mercatoList.innerHTML = `<p style="color: var(--danger-color); font-weight: 600;">${tr.simApiError}</p>`;
                }
            }
        }
        
        function renderMercato() {
            const tr = translations[currentLang];
            if (!mercatoList) return; 
            mercatoList.innerHTML = ''; 
            
            const coinDetails = {
                'bitcoin': { nome: 'Bitcoin', simbolo: 'BTC', icon: 'https://image.pollinations.ai/prompt/clean%20vector%20icon%20of%20bitcoin' },
                'ethereum': { nome: 'Ethereum', simbolo: 'ETH', icon: 'https://image.pollinations.ai/prompt/clean%20vector%20icon%20of%20ethereum%20crystal' },
                'dash': { nome: 'Dash', simbolo: 'DASH', icon: 'https://image.pollinations.ai/prompt/clean%20vector%20icon%20of%20dash%20coin' },
                'solana': { nome: 'Solana', simbolo: 'SOL', icon: 'https://image.pollinations.ai/prompt/clean%20vector%20icon%20of%20solana%20logo' },
                'binancecoin': { nome: 'BNB', simbolo: 'BNB', icon: 'https://image.pollinations.ai/prompt/clean%20vector%20icon%20of%20binance%20coin%20logo' },
                'ripple': { nome: 'XRP', simbolo: 'XRP', icon: 'https://image.pollinations.ai/prompt/clean%20vector%20icon%20of%20xrp%20logo' }
            };
            
            for (const id in prezziAttuali) {
                const coin = prezziAttuali[id];
                const details = coinDetails[id];
                const change24h = coin.eur_24h_change;
                
                const item = document.createElement('div');
                item.className = 'mercato-item';
                item.innerHTML = `
                    <div class="mercato-info">
                        <img src="${details.icon}" alt="${details.nome}" class="mercato-icon">
                        <div><div class="mercato-nome">${details.nome} <span>${details.simbolo}</span></div></div>
                    </div>
                    <div class="mercato-prezzo">
                        ${formatCurrency(coin.eur)}
                        <span class="${change24h >= 0 ? 'prezzo-positivo' : 'prezzo-negativo'}">
                            ${change24h >= 0 ? '▲' : '▼'} ${formatPercent(change24h)} (24h)
                        </span>
                    </div>
                    <div class="mercato-bottoni">
                        <button class="btn-sim btn-compra" data-id="${id}" data-nome="${details.nome}" data-prezzo="${coin.eur}">${tr.simBuy}</button>
                        <button class="btn-sim btn-vendi" data-id="${id}" data-nome="${details.nome}" data-simbolo="${details.simbolo}" data-prezzo="${coin.eur}">${tr.simSell}</button>
                    </div>
                `;
                mercatoList.appendChild(item);
            }
            
            document.querySelectorAll('.btn-compra').forEach(btn => btn.addEventListener('click', () => _apriModalSim('compra', btn.dataset)));
            document.querySelectorAll('.btn-vendi').forEach(btn => btn.addEventListener('click', () => _apriModalSim('vendi', btn.dataset)));
        }
        
        function renderPortafoglio() {
            const tr = translations[currentLang] || translations['it'];
            if (!portfolioAssetsEl) return; 
            
            let valoreCryptoTotale = 0;
            portfolioAssetsEl.innerHTML = ''; 
            let hasAssets = false;
            
            for (const id in portafoglio.crypto) {
                const quantita = portafoglio.crypto[id];
                if (quantita > 1e-9 && prezziAttuali[id]) { 
                    hasAssets = true;
                    const prezzo = prezziAttuali[id].eur;
                    const valoreAttuale = quantita * prezzo;
                    valoreCryptoTotale += valoreAttuale;
                    
                    const item = document.createElement('div');
                    item.className = 'asset-item';
                    item.innerHTML = `
                        <div class="asset-nome">${id.charAt(0).toUpperCase() + id.slice(1)}</div>
                        <div class="asset-valore">
                            ${formatCurrency(valoreAttuale)}
                            <span>${formatCrypto(quantita)} ${id.toUpperCase()}</span>
                        </div>
                    `;
                    portfolioAssetsEl.appendChild(item);
                } else if (quantita <= 1e-9) {
                     delete portafoglio.crypto[id]; 
                }
            }
            
            if (!hasAssets) {
                portfolioAssetsEl.innerHTML = `<p>${tr.simNoAssets}</p>`;
            }
            
            const valoreTotale = portafoglio.liquidi + valoreCryptoTotale;
            portfolioValoreTotaleEl.innerText = formatCurrency(valoreTotale);
            portfolioLiquidiEl.innerText = formatCurrency(portafoglio.liquidi);
        }
        
        function _apriModalSim(tipo, data) {
            const tr = translations[currentLang];
            modalData = { tipo, ...data }; 
            modalError.style.display = 'none';
            modalInput.value = '';
            
            modalSimContent.style.display = 'block';
            modalHotspotContent.style.display = 'none';
            modalConfermaBtn.style.display = 'inline-block';
            modalAnnullaBtn.style.display = 'inline-block';
            modalHotspotChiudiBtn.style.display = 'none';
            
            if (tipo === 'compra') {
                modalTitle.innerText = tr.simModalBuyTitle.replace('{coin}', data.nome);
                modalInfo.innerText = tr.simModalInfo.replace('{price}', formatCurrency(data.prezzo));
                modalLiquidi.innerText = formatCurrency(portafoglio.liquidi);
                modalLiquidi.parentElement.style.display = 'block';
                modalInput.placeholder = tr.simModalAmount;
            } else {
                const quantita = portafoglio.crypto[data.id] || 0;
                modalTitle.innerText = tr.simModalSellTitle.replace('{coin}', data.nome);
                modalInfo.innerText = tr.simModalInfo.replace('{price}', formatCurrency(data.prezzo));
                modalLiquidi.innerText = tr.simAssetAvailable
                    .replace('{amount}', formatCrypto(quantita))
                    .replace('{symbol}', data.simbolo.toUpperCase());
                modalLiquidi.parentElement.style.display = 'block';
                modalInput.placeholder = tr.simModalAmount;
            }
            modal.style.display = "block";
        }
        
        function eseguiTransazione() {
            const tr = translations[currentLang];
            const importoEuro = parseFloat(modalInput.value);
            const prezzo = parseFloat(modalData.prezzo);
            const id = modalData.id;
            
            if (isNaN(importoEuro) || importoEuro <= 0) {
                modalError.innerText = tr.simErrorAmount;
                modalError.style.display = 'block';
                return;
            }
            
            if (modalData.tipo === 'compra') {
                if (importoEuro > portafoglio.liquidi) {
                    modalError.innerText = tr.simErrorCash;
                    modalError.style.display = 'block';
                    return;
                }
                const quantitaCrypto = importoEuro / prezzo;
                portafoglio.liquidi -= importoEuro;
                portafoglio.crypto[id] = (portafoglio.crypto[id] || 0) + quantitaCrypto;
            } else if (modalData.tipo === 'vendi') {
                const quantitaCryptoDaVendere = importoEuro / prezzo;
                const quantitaPosseduta = portafoglio.crypto[id] || 0;
                
                if (quantitaCryptoDaVendere > (quantitaPosseduta + 1e-9)) {
                    modalError.innerText = tr.simErrorAsset.replace('{symbol}', modalData.simbolo.toUpperCase());
                    modalError.style.display = 'block';
                    return;
                }
                portafoglio.liquidi += importoEuro;
                portafoglio.crypto[id] -= quantitaCryptoDaVendere;
            }
            savePortafoglio();
            chiudiModal();
        }
        
        function chiudiModal() {
            modal.style.display = "none";
        }
        
        modalConfermaBtn.addEventListener('click', eseguiTransazione);
        modalAnnullaBtn.addEventListener('click', chiudiModal);
        modalHotspotChiudiBtn.addEventListener('click', chiudiModal);
        resetBtn.addEventListener('click', resetPortafoglio);
        window.onclick = function(event) {
            if (event.target == modal) {
                chiudiModal();
            }
        }
        
        // --- LOGICA HOTSPOT GRAFICO ---
        function setupHotspots() {
            document.querySelectorAll('.hotspot').forEach(hotspot => {
                hotspot.addEventListener('click', (e) => {
                    const tipo = e.target.dataset.hotspot;
                    const tr = translations[currentLang];
                    let titleKey = '';
                    let descKey = '';

                    if (tipo === 'candela') {
                        titleKey = 'hotspotCandelaTitle';
                        descKey = 'hotspotCandelaDesc';
                    } else if (tipo === 'supporto') {
                        titleKey = 'hotspotSupportoTitle';
                        descKey = 'hotspotSupportoDesc';
                    } else if (tipo === 'resistenza') {
                        titleKey = 'hotspotResistenzaTitle';
                        descKey = 'hotspotResistenzaDesc';
                    } else if (tipo === 'volume') {
                        titleKey = 'hotspotVolumeTitle';
                        descKey = 'hotspotVolumeDesc';
                    }
                    
                    // Configura il modal per l'hotspot
                    modalSimContent.style.display = 'none';
                    modalHotspotContent.style.display = 'block';
                    modalConfermaBtn.style.display = 'none';
                    modalAnnullaBtn.style.display = 'none';
                    modalHotspotChiudiBtn.style.display = 'inline-block';
                    
                    modalTitle.innerText = tr[titleKey];
                    modalHotspotContent.innerHTML = `<p>${tr[descKey]}</p>`; // Usa innerHTML per renderizzare il link
                    
                    modal.style.display = 'block';
                });
            });
        }
        
        // --- LOGICA GRAFICO TRADINGVIEW ---
        let tradingViewWidgetLoaded = false;
        function loadTradingViewWidget(lang) {
            // Se già caricato o se il container non c'è, esci
            if (tradingViewWidgetLoaded || !document.getElementById('tradingview_widget_container_inner')) {
                return; 
            }
            // Se la libreria non è ancora pronta, riprova tra 100ms
            if (typeof TradingView === 'undefined') {
                setTimeout(() => loadTradingViewWidget(lang), 100);
                return; 
            }
            
            const container = document.getElementById('tradingview_widget_container_inner');
            container.innerHTML = ''; 
            new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": "KRAKEN:DASHEUR", // DASH in EUR
                "interval": "D", 
                "timezone": "Europe/Rome",
                "theme": "light",
                "style": "1",
                "locale": lang,
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true, // Permette all'utente di cambiare crypto
                "container_id": "tradingview_widget_container_inner"
            });
            tradingViewWidgetLoaded = true; // Imposta il flag
        }
        
        // --- LOGICA NAVIGAZIONE A SCHEDE (TABS) ---
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabPanels = document.querySelectorAll('.tab-panel');
        const skipLinks = document.querySelectorAll('.tab-skip-link');
        const nextButtons = document.querySelectorAll('.btn-avanti-tappa');

        function showTab(tabId) {
            tabButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabId);
            });
            tabPanels.forEach(panel => {
                panel.classList.toggle('active', panel.id === tabId);
            });
            
            // Carica gli script solo quando la scheda "Pratica" è visibile
            if (tabId === 'pratica') {
                // Controlla se le funzioni sono definite prima di chiamarle
                if (typeof loadTradingViewWidget === 'function') loadTradingViewWidget(currentLang);
                if (typeof fetchPrezzi === 'function') fetchPrezzi();
            }
            
            window.scrollTo(0, 0); // Torna in cima al cambio scheda
        }

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                showTab(button.dataset.tab);
            });
        });
        
        skipLinks.forEach(link => {
            link.addEventListener('click', () => {
                showTab(link.dataset.tab);
            });
        });
        
        nextButtons.forEach(button => {
            button.addEventListener('click', () => {
                showTab(button.dataset.tab);
            });
        });

        
        // --- FUNZIONE DI TRADUZIONE PRINCIPALE ---
        function changeLanguage(lang) {
            if (!translations[lang]) lang = 'it';
            currentLang = lang;
            localStorage.setItem('preferredLang', lang); 
            
            const tr = translations[lang];
            
            document.documentElement.lang = lang;
            document.title = tr.pageTitle;
            
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.dataset.langKey;
                if (tr[key]) {
                    el.innerHTML = tr[key];
                }
            });
            
            populateRisorse(lang);
            
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            
            setupScrollAnimations();
            
            // Ricarica la FAQ
            const faqAnswers = document.querySelectorAll('.faq-answer');
            faqAnswers.forEach(answer => { answer.style.maxHeight = null; });
            document.querySelectorAll('.faq-item').forEach(item => { item.classList.remove('active'); });
            
            // Ricarica i widget solo se sono nella scheda attiva
            const activeTab = document.querySelector('.tab-panel.active').id;
            if (activeTab === 'pratica') {
                fetchPrezzi(); 
                loadTradingViewWidget(lang); 
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            langButtons.forEach(button => {
                button.addEventListener('click', () => {
                    changeLanguage(button.dataset.lang);
                });
            });
            
            setupFAQ(); 
            setupHotspots(); // Inizializza i nuovi hotspot
            loadPortafoglio(); 
            
            let preferredLang = localStorage.getItem('preferredLang');
            if (!preferredLang || !translations[preferredLang]) {
                preferredLang = navigator.language.split('-')[0];
            }
            if (!translations[preferredLang]) {
                preferredLang = 'it';
            }
            
            changeLanguage(preferredLang); 
            
            // Mostra la prima scheda
            showTab('teoria');
            
            // Aggiorna i prezzi del simulatore ogni 60 secondi
            setInterval(fetchPrezzi, 60000); 
        });

        function setupScrollAnimations() {
            const animatedElements = document.querySelectorAll('.animate-on-scroll');

            if ("IntersectionObserver" in window) {
                const observer = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, {
                    threshold: 0.1
                });

                animatedElements.forEach(el => {
                    el.classList.remove('is-visible'); 
                    observer.observe(el);
                });
            } else {
                animatedElements.forEach(el => {
                    el.classList.add('is-visible');
                });
            }
        }
        
        if(!localStorage.getItem('cookie_ack')){
            const b=document.createElement('div');
            b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#0a2e5c;color:#fff;padding:12px 16px;font-size:14px;z-index:9999;';
            b.innerHTML='Usiamo link affiliati e, se attivi analytics, potremmo usare cookie tecnici/analitici. <button id="okc" style="margin-left:12px;background:#1ce783;color:#111;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;">Ok</button>';
            document.body.appendChild(b);
            document.getElementById('okc').onclick=()=>{ localStorage.setItem('cookie_ack','1'); b.remove(); };
        }
    </script>
