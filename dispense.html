        :root {
            --primary-color: #0a2e5c;
            --secondary-color: #D4AF37;
            --cta-color: #1ce783;
            --dark-color: #1a1a1a;
            --light-color: #ffffff;
            --background-color: #f9faff;
            --text-color: #333;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Lato', sans-serif;
            --card-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
            --transition-speed: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--background-color);

        .container { max-width: 1280px; margin: 0 auto; padding: 0 2rem; }

            padding: 1rem 0;

            border-bottom: 3px solid var(--secondary-color);
        }
        .nav-container {

            justify-content: space-between;
            align-items: center;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .nav-logo {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--light-color);
            text-decoration: none;

        .nav-logo span { color: var(--secondary-color); font-weight: 700; }
        .nav-menu { list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0; }
        .nav-menu li a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 700;
            font-family: var(--font-heading);
            font-size: 1rem;
            transition: color 0.3s ease;
            padding: 0.5rem 0;
        }
        .nav-menu li a:hover,
        .nav-menu li a.current {
            color: var(--light-color);
            border-bottom: 2px solid var(--secondary-color);
        }
        .nav-toggle { display: none; }

            .nav-container { flex-wrap: wrap; padding: 0 1rem; }
            .nav-menu { display: none; flex-direction: column; width: 100%; gap: 0.5rem; margin-top: 1rem; }

            .nav-menu li { text-align: center; width: 100%; }
            .nav-menu li a { display: block; padding: 0.75rem 0; }
            .nav-menu li a:hover, .nav-menu li a.current { border-bottom: none; background-color: rgba(255,255,255,0.1); }
            .nav-toggle { display: block; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }

        /* === Header Semplice === */
        .hero-simple {
            padding: 6rem 2rem;
            background: linear-gradient(45deg, var(--primary-color), #0a2549);
            color: var(--light-color);
            text-align: center;
        }
        .hero-simple h1 {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 700;
        }
        .hero-simple p {
            font-size: 1.5rem;
            font-weight: 300;
            max-width: 700px;
            margin: 1rem auto 0;
            color: rgba(255, 255, 255, 0.8);
        }
        @media (max-width: 768px) {
            .hero-simple { padding: 4rem 1rem; }
            .hero-simple h1 { font-size: 2.5rem; }
            .hero-simple p { font-size: 1.2rem; }
        }

        /* === Sezioni === */
        .section { padding: 5.5rem 0; position: relative; }
        .section-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 3.5rem; 
            font-weight: 700;
            text-align: center;
            position: relative;
        }
        .section-title::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -15px;
            transform: translateX(-50%);
            width: 80px;
            height: 5px;
            background: var(--secondary-color);
            border-radius: 3px;
        }
        
        /* Sfondi Sezioni */
        .section-risorse { background-color: var(--light-color); }
        .section-faq { background-color: var(--background-color); }
        .section-cta-pratica { background-color: var(--light-color); }
        .content-wrapper { max-width: 900px; margin: 0 auto; }

        /* === Stili Card Risorse === */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
            justify-content: center;
        }
        .conto-card {
            background-color: var(--light-color);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            border: 1px solid #eef;
            position: relative;
        }
        .conto-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }
        .conto-card-badge {
            position: absolute;
            top: 20px;
            left: -1px;
            background-color: var(--secondary-color);
            color: var(--dark-color);
            padding: 5px 20px;
            font-weight: 700;
            font-family: var(--font-heading);
            font-size: 0.9rem;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3);
        }
        .conto-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid #eef;
        }
        .conto-content {
            padding: 2.5rem;
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
        }
        .conto-content h3 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .conto-content p {
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            flex-grow: 1; 
        }
        .conto-cta {
            display: block;
            width: 100%;
            padding: 1.1rem 1.5rem;
            background: var(--primary-color);
            color: var(--light-color);
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(10, 46, 92, 0.2);
            margin-top: auto; /* Spinge il bottone in fondo */
        }
        .conto-cta:hover {
            background-color: var(--dark-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        /* === Stili FAQ === */
        .faq-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .faq-item {
            background: var(--light-color);
            border-radius: 12px;
            border: 1px solid #eef;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            overflow: hidden; 
        }
        .faq-question {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.75rem 2rem;
            background: var(--light-color);
            border: none;
            cursor: pointer;
            text-align: left;
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            transition: background-color 0.3s ease;
        }
        .faq-question:hover {
            background-color: #fcfdff;
        }
        .faq-question::after { 
            content: '+';
            font-family: 'Lato', sans-serif;
            font-size: 2rem;
            font-weight: 300;
            color: var(--primary-color);
            transition: transform 0.3s ease;
            margin-left: 1rem;
        }
        .faq-question.active::after { 
            content: '\00D7'; /* Simbolo 'x' */
            transform: scale(1.2);
        }
        .faq-answer {
            max-height: 0; 
            overflow: hidden;
            transition: max-height 0.4s ease-out;
        }
        .faq-answer p {
            padding: 0 2rem 1.75rem 2rem;
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-color);
        }
        
        /* === Stili CTA Box === */
        .cta-box {
            background: var(--light-color);
            padding: 3rem;
            border-radius: 16px;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: var(--card-shadow);
            border: 1px solid #eef;
        }
        .cta-box h3 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 0.75rem;
        }
        .cta-box p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .cta-box-link {
            display: inline-block;
            background: var(--cta-color);
            color: var(--dark-color);
            padding: 1.1rem 3rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .cta-box-link:hover {
            background: var(--primary-color);
            color: var(--light-color);
            transform: scale(1.05);
        }

        /* === Animazioni Scroll === */
        .animate-on-scroll {
            opacity: 0;
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .fade-in-up {
            transform: translateY(50px);
        }
        .is-visible {
            opacity: 1;
            transform: translate(0, 0);
        }

        // === VARIABILI GLOBALI ===
        let currentLang = 'it';

        // === FUNZIONE CAMBIO LINGUA ===
        function changeLanguage(lang) {
            if (!translations[lang]) lang = 'it';
            currentLang = lang;
            localStorage.setItem('preferredLang', lang); 
            
            const tr = translations[lang];
            
            document.documentElement.lang = lang;
            
            if (tr.pageTitleDispense) {
                document.title = tr.pageTitleDispense;
            }
            
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.dataset.langKey;
                if (tr[key]) {
                    el.innerHTML = tr[key];
                }
            });
            
            document.querySelectorAll('.lang-selector button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // --- Ricarica i contenuti dinamici ---
            setupRisorse();
        }

        // === FUNZIONE PER POPOLARE LE RISORSE ===
        function setupRisorse() {
            const container = document.getElementById('risorse-grid');
            if (!container) return;

            const tr = translations[currentLang];
            container.innerHTML = ''; // Pulisci il container

            risorseData.forEach((risorsa, index) => {
                const card = document.createElement('div');
                card.className = 'conto-card animate-on-scroll fade-in-up';
                card.style.transitionDelay = `${index * 100}ms`;
                card.id = risorsa.id;
                
                card.innerHTML = `
                    <div class="conto-card-badge">${tr[risorsa.typeKey] || risorsa.typeKey}</div>
                    <img src="${risorsa.imageUrl}" alt="${tr[risorsa.titleKey] || ''}" class="conto-image" loading="lazy">
                    <div class="conto-content">
                        <h3>${tr[risorsa.titleKey] || risorsa.titleKey}</h3>
                        <p>${tr[risorsa.descriptionKey] || risorsa.descriptionKey}</p>
                        <a href="${risorsa.linkUrl}" target="_blank" rel="noopener noreferrer sponsored" class="conto-cta">
                            ${tr[risorsa.ctaKey] || risorsa.ctaKey}
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });

            // Ri-attiva le animazioni per le nuove card
            setupScrollAnimations();
        }

        // === FUNZIONE PER FAQ ===
        function setupFAQ() {
            const faqItems = document.querySelectorAll('.faq-item');
            faqItems.forEach(item => {
                const questionButton = item.querySelector('.faq-question');
                const answerPanel = item.querySelector('.faq-answer');

                if (!questionButton || !answerPanel) return;

                questionButton.addEventListener('click', () => {
                    const isExpanded = questionButton.classList.contains('active');
                    
                    // Chiudi tutti gli altri
                    faqItems.forEach(otherItem => {
                        otherItem.querySelector('.faq-question').classList.remove('active');
                        otherItem.querySelector('.faq-question').setAttribute('aria-expanded', 'false');
                        otherItem.querySelector('.faq-answer').style.maxHeight = null;
                    });
                    
                    // Apri/Chiudi questo
                    if (!isExpanded) {
                        questionButton.classList.add('active');
                        questionButton.setAttribute('aria-expanded', 'true');
                        answerPanel.style.maxHeight = answerPanel.scrollHeight + "px";
                    }
                });
            });
        }

        // === FUNZIONE PER ANIMAZIONI SCROLL ===
        function setupScrollAnimations() {
            const animatedElements = document.querySelectorAll('.animate-on-scroll');
            if ("IntersectionObserver" in window) {
                const observer = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });

                animatedElements.forEach(el => {
                    if (!el.classList.contains('is-visible')) { // Anima solo se non è già visibile
                        observer.observe(el);
                    }
                });
            } else {
                animatedElements.forEach(el => el.classList.add('is-visible'));
            }
        }

        // === EVENT LISTENER AL CARICAMENTO ===
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- Logica per il Menu Mobile ---
            const navToggle = document.getElementById('nav-toggle');
            const navMenu = document.getElementById('nav-menu');
            if (navToggle && navMenu) {
                navToggle.addEventListener('click', () => {
                    const isActive = navMenu.classList.toggle('is-active');
                    navToggle.setAttribute('aria-expanded', isActive);
                });
            }

            // --- Logica per il Selettore Lingua ---
            const langButtons = document.querySelectorAll('.lang-selector button');
            langButtons.forEach(button => {
                button.addEventListener('click', () => {
                    changeLanguage(button.dataset.lang);
                });
            });

            // --- Inizializza FAQ ---
            setupFAQ();

            // --- Inizializza Lingua e Contenuti ---
            let preferredLang = localStorage.getItem('preferredLang');
            let initialLang = 'it';
            if (preferredLang && translations[preferredLang]) {
                initialLang = preferredLang;
            } else {
                let browserLang = navigator.language.split('-')[0];
                initialLang = translations[browserLang] ? browserLang : 'it';
            }
            changeLanguage(initialLang); // Questo chiamerà anche setupRisorse e setupScrollAnimations
            
            // --- Cookie Banner ---
            if(!localStorage.getItem('cookie_ack')){
                const b=document.createElement('div');
                b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#0a2e5c;color:#fff;padding:12px 16px;font-size:14px;z-index:9999;';

                document.body.appendChild(b);
                document.getElementById('okc').onclick=()=>{ localStorage.setItem('cookie_ack','1'); b.remove(); };
            }
        });
