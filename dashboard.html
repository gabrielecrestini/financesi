<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Utente - CryptoStarStudio.it</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary-bg: #0F0F1A; --secondary-bg: #1A1A2A; --accent-color: #00A8FF;
            --text-light: #EFEFEF; --text-dark: #A0A0B0; --gradient-start: #00A8FF;
            --gradient-end: #00FFC2; --border-radius: 8px; --shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            --font-heading: 'Inter', sans-serif; --font-body: 'Lato', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body); color: var(--text-light);
            background-color: var(--primary-bg); line-height: 1.6;
        }
        /* Nasconde il contenuto finché il check non è finito */
        body.hidden { display: none; }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading); font-weight: 700;
            color: var(--text-light); margin-bottom: 1rem;
        }
        h2 { font-size: 2rem; font-weight: 900; }
        h3 { font-size: 1.5rem; font-weight: 700; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, var(--gradient-start), var(--gradient-end), var(--gradient-start));
            background-size: 200% auto; color: var(--primary-bg); padding: 0.8rem 2rem;
            border-radius: var(--border-radius); text-transform: uppercase; font-weight: 700;
            letter-spacing: 0.5px; transition: all 0.4s ease; border: none;
            cursor: pointer; box-shadow: var(--shadow); font-family: var(--font-heading);
            text-align: center; animation: gradient-animation 4s ease infinite;
        }
        .btn:hover {
            transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 255, 194, 0.4);
            background-position: right center;
        }
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        .btn-outline {
            background: transparent; border: 2px solid var(--accent-color);
            color: var(--accent-color); box-shadow: none; animation: none; background-image: none;
        }
        .btn-outline:hover { background: var(--accent-color); color: var(--primary-bg); }

        /* Layout Dashboard */
        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.5rem 2rem; background-color: var(--secondary-bg);
            border-bottom: 2px solid var(--accent-color);
        }
        .dashboard-header h1 {
            font-size: 1.8rem; margin: 0;
            background: linear-gradient(45deg, var(--gradient-start), var(--gradient-end)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .user-info { font-size: 0.9rem; color: var(--text-dark); }
        #user-email {
            color: var(--text-light); font-weight: 700; margin-right: 1rem;
        }
        
        /* CARD MODIFICATA */
        .dashboard-card {
            background-color: var(--secondary-bg);
            padding: 2rem; border-radius: var(--border-radius);
            box-shadow: var(--shadow); margin-top: 2rem;
        }
        .dashboard-card h2 {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }
        .dashboard-card .btn {
            margin-top: 2rem; /* Spazio per il pulsante */
        }

        /* Stili Tabella Riepilogo */
        .agenda-table-wrapper { overflow-x: auto; }
        #agenda-table {
            width: 100%; border-collapse: collapse; margin-top: 2rem;
        }
        #agenda-table th, #agenda-table td {
            padding: 0.75rem 1rem; border-bottom: 1px solid var(--primary-bg);
            text-align: left;
        }
        #agenda-table th {
            color: var(--text-light); text-transform: uppercase; font-size: 0.9rem;
        }
        #agenda-table td { color: var(--text-dark); }
        /* Stile per il costo totale */
        #agenda-table td:last-child {
            font-weight: 700; color: var(--gradient-end);
        }

        @media (max-width: 768px) {
            .dashboard-header { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body class="hidden">

    <header class="dashboard-header">
        <h1>Dashboard Utente</h1>
        <div class="user-info">
            <span id="user-email">Caricamento...</span>
            <button id="logout-btn" class="btn btn-outline" style="padding: 0.5rem 1rem; margin-left: 1rem;">Logout</button>
        </div>
    </header>

    <main class="container">
        
        <section id="agenda-card" class="dashboard-card">
            
            <h2>Ultimi Acquisti</h2>
            
            <div class="agenda-table-wrapper">
                <table id="agenda-table">
                    <thead>
                        <tr>
                            <th>Crypto</th>
                            <th>Quantità</th>
                            <th>Prezzo Acquisto</th>
                            <th>Costo Totale</th>
                        </tr>
                    </thead>
                    <tbody id="agenda-table-body">
                        <tr><td colspan="4" style="text-align: center; color: var(--text-dark);">Caricamento...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <a href="agenda.html" class="btn">
                Vai all'Agenda Completa <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
            </a>
            
        </section>
        
        </main>

    <script>
        // --- COLLEGAMENTO SUPABASE ---
        const SUPABASE_URL = 'https://siojtnnsjagksuhxrwpi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpb2p0bm5zamFna3N1aHhyd3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA2NTY3MTYsImV4cCI6MjA3NjIzMjcxNn0.EmfZZZ6AlEoZoTwkReD6a2LRnHekaan-RGnt1fEa3c8';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Elementi DOM ---
        const userEmailEl = document.getElementById('user-email');
        const logoutBtn = document.getElementById('logout-btn');
        const pageBody = document.querySelector('body');
        const agendaTableBody = document.getElementById('agenda-table-body');
        let currentUserId = null; // Variabile per salvare l'ID utente

        // --- 1. SCRIPT DI PROTEZIONE (GUARD) ---
        async function checkUserSession() {
            const { data, error } = await _supabase.auth.getSession();
            
            if (error) {
                console.error('Errore nel recupero sessione:', error);
                window.location.href = 'auth.html'; // Errore, manda al login
                return;
            }
            
            if (!data.session) {
                // NON C'E' SESSIONE, utente non loggato
                console.log('Nessuna sessione trovata. Redirect al login.');
                window.location.href = 'auth.html';
            } else {
                // Utente loggato!
                console.log('Sessione trovata:', data.session);
                currentUserId = data.session.user.id; // Salva l'ID
                if (userEmailEl) {
                    userEmailEl.textContent = data.session.user.email;
                }
                // Mostra la pagina e carica i dati
                pageBody.classList.remove('hidden');
                loadPageData();
            }
        }
        checkUserSession(); // Eseguo il controllo all'avvio
        
        // --- 2. FUNZIONE DI LOGOUT ---
        async function handleLogout() {
            const { error } = await _supabase.auth.signOut();
            if (error) {
                console.error('Errore durante il logout:', error);
            } else {
                window.location.href = 'auth.html';
            }
        }
        logoutBtn.addEventListener('click', handleLogout);

        // --- 3. CARICAMENTO DATI PAGINA ---
        function loadPageData() {
            // Carica solo le ultime transazioni
            loadLatestTransactions(currentUserId);
        }

        // --- 4. [NUOVA FUNZIONE] CARICA ULTIME TRANSAZIONI ---
        async function loadLatestTransactions(userId) {
            if (!userId) return;

             const { data, error } = await _supabase
                .from('transactions') // Legge dalla tabella
                .select('*')
                .eq('user_id', userId) // Solo quelle dell'utente
                .order('created_at', { ascending: false }) // Le più recenti prima
                .limit(5); // SOLO LE ULTIME 5

            if (error) {
                console.error('Errore caricamento transazioni:', error);
                agendaTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff5252;">Errore nel caricamento.</td></tr>`;
                return;
            }

            if (data.length === 0) {
                agendaTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-dark);">Nessuna transazione trovata. Inizia aggiungendone una dall'agenda!</td></tr>`;
                return;
            }

            // Costruisci le righe della tabella
            agendaTableBody.innerHTML = data.map(tx => {
                const totalCost = (tx.amount * tx.purchase_price).toFixed(2);
                return `
                    <tr>
                        <td style="color: var(--text-light); font-weight: 700;">${tx.ticker.toUpperCase()}</td>
                        <td>${tx.amount}</td>
                        <td>${tx.purchase_price.toFixed(2)} €</td>
                        <td>${totalCost} €</td>
                    </tr>
                `;
            }).join('');
        }

    </script>
</body>
</html>
