<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cryptostarstudio - Piattaforme Selezionate</title>

    
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary-color: #0a2e5c;
            --secondary-color: #D4AF37;
            --cta-color: #1ce783;
            --dark-color: #1a1a1a;
            --light-color: #ffffff;
            --background-color: #f9faff;
            --text-color: #333;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Lato', sans-serif;
            --card-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
            --transition-speed: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--background-color);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--light-color);
            overflow: hidden;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            background-image: url('https://image.pollinations.ai/prompt/futuristic%20financial%20digital%20interface%20background%20blue%20and%20gold%20data%20network%20secure%20elegant%20high%20resolution%204k');
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(10, 46, 92, 0.85), rgba(0, 0, 0, 0.7));
            z-index: 1;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 950px;
            padding: 2rem;
            margin: 0 auto;
        }

        .hero-content h1 {
            font-family: var(--font-heading);
            font-size: 5rem; 
            margin-bottom: 1rem;
            line-height: 1.1;
            font-weight: 800;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            color: var(--light-color);
        }

        .hero-content p {
            font-size: 2rem; 
            margin-bottom: 2.5rem;
            font-weight: 300;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: rgba(255, 255, 255, 0.9);
        }

        .hero-cta {
            display: inline-block;
            background: var(--cta-color);
            color: var(--dark-color);
            padding: 1.2rem 3.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.4rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(28, 231, 131, 0.3);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hero-cta:hover {
            background: var(--light-color);
            color: var(--primary-color);
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.3);
        }
        
        .scroll-down-arrow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -15px); }
            60% { transform: translate(-50%, -5px); }
        }

        .section {
            padding: 5.5rem 0; 
            position: relative;
        }
        
        .section-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 3.5rem; 
            font-weight: 700;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -15px;
            transform: translateX(-50%);
            width: 80px;
            height: 5px;
            background: var(--secondary-color);
            border-radius: 3px;
        }
        
        .section-conti { background-color: var(--light-color); }
        .section-app { background-color: var(--background-color); }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 380px));
            gap: 2.5rem;
            justify-content: center;
        }

        .conto-card {
            background-color: var(--light-color);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            border: 1px solid #eef;
            position: relative;
        }

        .conto-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }
        
        .conto-card-badge {
            position: absolute;
            top: 20px;
            left: -1px;
            background-color: var(--secondary-color);
            color: var(--dark-color);
            padding: 5px 20px;
            font-weight: 700;
            font-family: var(--font-heading);
            font-size: 0.9rem;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3);
        }

        .conto-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .conto-content {
            padding: 2.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .conto-content h3 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .conto-content p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            flex-grow: 1; 
        }

        .conto-cta {
            display: block;
            width: 100%;
            padding: 1.1rem 1.5rem;
            background: var(--primary-color);
            color: var(--light-color);
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(10, 46, 92, 0.2);
        }

        .conto-cta:hover {
            background-color: var(--dark-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .app-feature-container {
            display: flex;
            flex-direction: column;
            gap: 4.5rem; 
            align-items: center;
        }
        
        .app-feature-item {
            display: flex;
            align-items: center;
            gap: 4rem;
            width: 100%;
            max-width: 1100px;
        }
        
        .app-feature-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        .app-image-wrapper {
            flex: 1;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .app-image {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            transition: transform var(--transition-speed);
            display: block;
        }
        
        .app-feature-item:hover .app-image {
            transform: scale(1.03);
        }

        .app-content {
            flex: 1;
            text-align: left;
        }

        .app-content h3 {
            font-family: var(--font-heading);
            font-size: 2.6rem; 
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .app-content .description {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        
        .app-features-list {
            list-style: none;
            margin-bottom: 2.5rem;
        }
        
        .app-features-list li {
            position: relative;
            padding-left: 35px;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        .app-features-list li::before {
            content: '✔';
            position: absolute;
            left: 0;
            top: 0;
            color: var(--cta-color);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .app-cta {
            display: inline-block;
            background: var(--cta-color);
            color: var(--dark-color);
            padding: 1.1rem 3rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(28, 231, 131, 0.3);
        }

        .app-cta:hover {
            background: var(--primary-color);
            color: var(--light-color);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 12px 35px rgba(10, 46, 92, 0.3);
        }

        .card-disclaimers {
            margin: 1.5rem 0;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
        .risk-warning {
            font-size: 0.9rem;
            color: #555;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .geo-warning {
            font-size: 0.85rem;
            color: #777;
        }
        .app-content .card-disclaimers {
             margin-top: 0;
             padding-top: 0;
             border-top: none;
             margin-bottom: 1.5rem;
        }

        .section-disclosure {
            background-color: var(--background-color);
            padding-bottom: 0;
            margin-top: -3rem;
            padding-top: 5rem;
        }

        .disclosure-box {
            background-color: var(--light-color);
            border: 1px solid #eef;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
        }
        
        .disclosure-box h3 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .disclosure-box p {
            font-size: 1rem;
            color: #555;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        footer {
            background-color: var(--primary-color);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            padding: 4rem 2rem 2rem 2rem; 
            margin-top: 5rem;
            position: relative;
        }
        
        .lang-selector {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .lang-selector button {
            background: none;
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            padding: 8px 15px;
            font-weight: 700;
            font-family: var(--font-heading);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .lang-selector button:hover {
            background-color: var(--secondary-color);
            color: var(--dark-color);
        }
        
        .lang-selector button.active {
            background-color: var(--secondary-color);
            color: var(--dark-color);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        footer p {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        footer p:first-of-type { 
            font-weight: 700;
            color: var(--light-color);
            font-size: 1.1rem;
        }
        
        .footer-links {
            margin: 1rem 0;
        }
        .footer-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-links a:hover {
            color: var(--light-color);
            text-decoration: underline;
        }

        .animate-on-scroll {
            opacity: 0;
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        
        .fade-in-up {
            transform: translateY(50px);
        }
        
        .slide-in-left {
            transform: translateX(-100px);
        }
        
        .slide-in-right {
            transform: translateX(100px);
        }
        
        .zoom-in {
            transform: scale(0.9);
        }

        .is-visible {
            opacity: 1;
            transform: translate(0, 0) scale(1);
        }
        
        .crypto-assistant {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .crypto-assistant.is-visible {
            transform: translateX(0);
        }
        .assistant-mascot {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--light-color);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            border: 3px solid var(--light-color);
            object-fit: cover;
        }
        .assistant-bubble {
            background: var(--light-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            width: 320px;
            position: relative;
        }
        .assistant-question {
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .assistant-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .assistant-btn {
            display: block;
            text-decoration: none;
            background: var(--background-color);
            color: var(--primary-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .assistant-btn:hover {
            background: var(--primary-color);
            color: var(--light-color);
        }
        .assistant-close {
            position: absolute;
            top: 5px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #aaa;
            cursor: pointer;
            z-index: 2;
            line-height: 1;
        }
        .assistant-close:hover { color: #333; }

        @media (max-width: 1024px) {
            .hero-content h1 { font-size: 4rem; }
            .hero-content p { font-size: 1.7rem; }
            .section { padding: 4.5rem 0; }
            .section-title { font-size: 2.8rem; }
            .app-content h3 { font-size: 2.4rem; }
            .app-feature-item, .app-feature-item:nth-child(even) {
                flex-direction: column;
                gap: 2rem;
                text-align: center;
            }
            .app-image-wrapper { max-width: 80%; }
            .app-content { text-align: center; }
            .app-features-list { text-align: center; }
            .app-features-list li { 
                padding-left: 0; 
                display: inline-block;
                margin-right: 15px;
                text-align: left;
                font-size: 1rem;
            }
            .app-features-list li::before {
                position: static;
                margin-right: 8px;
            }
            .app-cta { text-align: center; }
        }
        
        @media (max-width: 768px) {
            .container { padding: 0 1rem; }
            .hero { height: 90vh; }
            .hero-content h1 { font-size: 2.8rem; }
            .hero-content p { font-size: 1.4rem; }
            .hero-cta { font-size: 1.1rem; padding: 1rem 2.5rem; }
            .section { padding: 4rem 0; }
            .section-title { font-size: 2.5rem; }
            .card-grid { grid-template-columns: 1fr; gap: 2rem; }
            .conto-content { padding: 2rem; }
            .conto-content h3 { font-size: 1.8rem; }
            .app-content h3 { font-size: 2.2rem; }
            .app-content .description { font-size: 1.1rem; }
            .app-features-list li { 
                font-size: 0.95rem; 
                margin-bottom: 0.8rem;
                display: block;
                text-align: center;
            }
            .app-features-list li::before {
                margin-right: 5px;
                font-size: 1.1rem;
            }
        }
        
        @media (max-width: 480px) {
            .hero-content h1 { font-size: 2.4rem; }
            .hero-content p { font-size: 1.2rem; }
            .section-title { font-size: 2rem; }
            .conto-content h3 { font-size: 1.6rem; }
            .conto-content { padding: 1.5rem; }
            .app-content h3 { font-size: 1.8rem; }
            .app-cta { padding: 0.9rem 2rem; font-size: 1.1rem; }
            
            .lang-selector {
                gap: 5px;
            }
            .lang-selector button {
                padding: 6px 12px;
                font-size: 0.9rem;
            }

            .assistant-mascot { display: none; }
            .crypto-assistant {
                left: 10px;
                right: 10px;
                bottom: 10px;
                width: auto;
            }
            .assistant-bubble { width: 100%; }
        }

    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <h1 class="animate__animated animate__fadeInDown" data-lang-key="heroTitle"></h1>
            <p class="animate__animated animate__fadeInUp animate__delay-1s" data-lang-key="heroSubtitle"></p>
            <a href="#conti" class="hero-cta animate__animated animate__pulse animate__delay-2s" data-lang-key="heroCta"></a>
        </div>
        <a href="#conti" class="scroll-down-arrow" aria-label="Scorri verso il basso">↓</a>
    </header>

    <main>

        
        <section id="conti" class="section section-conti">
            <div class="container">
                <h2 class="section-title animate-on-scroll fade-in-up" data-lang-key="contiTitle"></h2>
                <div id="conti-grid" class="card-grid">
                    
                </div>
            </div>
        </section>

        
        <section id="app" class="section section-app">
            <div class="container">
                <h2 class="section-title animate-on-scroll fade-in-up" data-lang-key="appTitle"></h2>
                <div id="app-container" class="app-feature-container">
                    
                </div>
            </div>
        </section>
        
        <section id="disclosure" class="section section-disclosure">
            <div class="container">
                <div class="disclosure-box animate-on-scroll fade-in-up">
                    <h3 data-lang-key="disclosureTitle"></h3>
                    <p data-lang-key="disclosureText"></p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <div class="lang-selector">
                <button data-lang="it">Italiano</button>
                <button data-lang="en">English</button>
                <button data-lang="es">Español</button>
            </div>
            <p data-lang-key="footerBrand"></p>
            <p>&copy; 2025. <span data-lang-key="footerRights"></span></p>
            
            <p class="footer-links">
                <a href="privacy.html" data-lang-key="privacyLink"></a> &middot; 
                <a href="termini.html" data-lang-key="termsLink"></a> &middot; 
                <a href="#disclosure" data-lang-key="disclosureLink"></a>
            </p>
            <p data-lang-key="notAffiliated"></p>
            <p data-lang-key="footerDisclaimer"></p>
        </div>
    </footer>

    <div id="crypto-assistant" class="crypto-assistant">
        <button id="assistant-close" class="assistant-close" aria-label="Chiudi">&times;</button>
        <img src="https://image.pollinations.ai/prompt/cute%20cartoon%20robot%20financial%20assistant%20vector%20logo%20clean%20white%20background" alt="Crypto Mascot" class="assistant-mascot">
        <div class="assistant-bubble">
            <p class="assistant-question" data-lang-key="assistantQuestion"></p>
            <div class="assistant-options">
                <a href="#app-bitpanda" class="assistant-btn" data-lang-key="assistantOpt1"></a>
                <a href="#app-youhodler" class="assistant-btn" data-lang-key="assistantOpt2"></a>
                <a href="#conto-finom" class="assistant-btn" data-lang-key="assistantOpt3"></a>
                <a href="#conto-iuvo" class="assistant-btn" data-lang-key="assistantOpt4"></a>
            </div>
        </div>
    </div>

        function changeLanguage(lang) {
            if (!translations[lang]) lang = 'it';
            currentLang = lang;
            localStorage.setItem('preferredLang', lang); 
            
            const tr = translations[lang];
            
            document.documentElement.lang = lang;
            document.title = tr.pageTitle;
            
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.dataset.langKey;
                if (tr[key]) {
                    el.innerHTML = tr[key];
                }
            });
            
            populateConti(lang);
            populateApp(lang);
            
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            
            setupScrollAnimations();
        }

        document.addEventListener('DOMContentLoaded', () => {
            langButtons.forEach(button => {
                button.addEventListener('click', () => {
                    changeLanguage(button.dataset.lang);
                });
            });

            let preferredLang = localStorage.getItem('preferredLang');
            if (preferredLang && translations[preferredLang]) {
                changeLanguage(preferredLang);
            } else {
                let browserLang = navigator.language.split('-')[0];
                changeLanguage(translations[browserLang] ? browserLang : 'it');
            }

            const assistant = document.getElementById('crypto-assistant');
            const closeBtn = document.getElementById('assistant-close');

            if (assistant && closeBtn) {
                if (!localStorage.getItem('assistant_closed')) {
                    setTimeout(() => {
                        assistant.classList.add('is-visible');
                    }, 7000);
                }

                const closeAssistant = () => {
                    assistant.classList.remove('is-visible');
                    localStorage.setItem('assistant_closed', 'true');
                };

                closeBtn.addEventListener('click', closeAssistant);

                document.querySelectorAll('.assistant-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        setTimeout(closeAssistant, 300);
                    });
                });
            }
        });

        function setupScrollAnimations() {
            const animatedElements = document.querySelectorAll('.animate-on-scroll');

            if ("IntersectionObserver" in window) {
                const observer = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, {
                    threshold: 0.1
                });

                animatedElements.forEach(el => {
                    el.classList.remove('is-visible'); 
                    observer.observe(el);
                });
            } else {
                animatedElements.forEach(el => {
                    el.classList.add('is-visible');
                });
            }
        }
        
        if(!localStorage.getItem('cookie_ack')){
            const b=document.createElement('div');

            document.body.appendChild(b);
            document.getElementById('okc').onclick=()=>{ localStorage.setItem('cookie_ack','1'); b.remove(); };
        }
